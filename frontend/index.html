<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XHS Link – 小红书内容聚合工具</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
<div class="app">

  <header>
    <h1>XHS Link</h1>
    <p>小红书内容批量采集与 AI 聚合工具</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="console">控制台</button>
    <button class="tab-btn" data-tab="history">历史记录</button>
    <button class="tab-btn" data-tab="settings">设置</button>
  </nav>

  <!-- ══ 控制台 Tab ══════════════════════════════════════════════ -->
  <div id="tab-console" class="tab-content active">

    <div class="status-bar">
      <span class="status-dot idle" id="status-dot"></span>
      <strong id="status-text">空闲</strong>
    </div>

    <div class="progress-container" id="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <span id="progress-text">0 / 0</span>
    </div>

    <button id="start-btn" class="btn btn-primary btn-large">▶ 开始运行</button>

    <div class="log-panel">
      <div class="log-toolbar">
        <span>运行日志</span>
        <button class="btn btn-small btn-secondary" id="clear-log-btn">清空</button>
      </div>
      <div class="log-output" id="log-output">
        <div class="log-line log-info">
          <span class="log-msg" style="color:#555">等待开始运行…</span>
        </div>
      </div>
    </div>

  </div>

  <!-- ══ 历史记录 Tab ═══════════════════════════════════════════ -->
  <div id="tab-history" class="tab-content">
    <div id="history-list">
      <p class="loading-text">加载中…</p>
    </div>
  </div>

  <!-- ══ 设置 Tab ═══════════════════════════════════════════════ -->
  <div id="tab-settings" class="tab-content">

    <!-- AI 模型配置 -->
    <div class="card">
      <h2>AI 模型配置</h2>
      <div class="form-group">
        <label>模型厂商</label>
        <input type="text" id="ai-provider"
          placeholder="例：openai / anthropic / google" />
      </div>
      <div class="form-group">
        <label>模型名称</label>
        <input type="text" id="ai-model"
          placeholder="例：gpt-4o / claude-3-5-sonnet-20241022 / gemini-2.0-flash" />
      </div>
      <div class="form-group">
        <label>API Base URL <small>（可选，留空使用官方默认）</small></label>
        <input type="text" id="ai-base-url"
          placeholder="例：https://api.openai.com/v1" />
      </div>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="ai-api-key" placeholder="sk-…" autocomplete="off" />
        <p id="ai-key-hint" class="hint" style="display:none"></p>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="save-ai-btn">保存 AI 配置</button>
      </div>
    </div>

    <!-- Google Sheets -->
    <div class="card">
      <h2>Google Sheets</h2>
      <div class="form-group">
        <label>Sheets ID</label>
        <input type="text" id="sheets-id"
          placeholder="Google Sheets URL 中间的字母数字串" />
      </div>
      <div class="form-row">
        <div class="status-label">
          <span class="status-dot idle" id="google-status-dot"></span>
          <span id="google-status-text">检查中…</span>
        </div>
        <button class="btn btn-secondary" id="google-auth-btn">授权 Google 账号</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="save-sheets-btn">保存 Sheets 配置</button>
      </div>
      <p class="hint">
        需要先创建 Google Cloud OAuth 2.0 凭据并将 <code>credentials.json</code>
        放入 <code>data/</code> 目录，然后点击「授权 Google 账号」完成授权。
      </p>
    </div>

    <!-- 小红书 Cookie -->
    <div class="card">
      <h2>小红书账号 Cookie</h2>
      <div class="form-row">
        <div class="status-label">
          <span class="status-dot idle" id="cookie-status-dot"></span>
          <span id="cookie-status-text">检查中…</span>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" id="capture-cookie-btn">获取 Cookie</button>
          <button class="btn btn-danger btn-small" id="cancel-cookie-btn"
            style="display:none">取消</button>
        </div>
      </div>
      <p class="hint">
        点击「获取 Cookie」将弹出小红书网页，在网页中完成登录后，
        系统自动检测登录状态并保存 Cookie，无需任何手动操作。
      </p>
    </div>

  </div>
</div>

<script src="/assets/js/app.js"></script>
<script src="/assets/js/settings.js"></script>
<script src="/assets/js/workflow.js"></script>
<script src="/assets/js/history.js"></script>
</body>
</html>
