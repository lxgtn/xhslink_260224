services:
  - type: web
    name: xhslink_260224_backend
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright python -m playwright install chromium --with-deps
      echo "=== Playwright installed ==="
      echo "=== Current directory: $(pwd) ==="
      echo "=== Directory contents: $(ls -la) ==="
      echo "=== Playwright directory: $(ls -la .playwright 2>/dev/null || echo 'not found') ==="
    startCommand: |
      echo "=== Starting service ==="
      echo "=== Current directory: $(pwd) ==="
      echo "=== Directory contents: $(ls -la) ==="
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright
    healthCheckPath: /api/auth/feishu/status
