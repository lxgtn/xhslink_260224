services:
  - type: web
    name: xhslink_260224_backend
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      export PLAYWRIGHT_BROWSERS_PATH=/opt/render/.cache/ms-playwright
      python -m playwright install chromium
      echo "=== Playwright cache after install ==="
      ls -la /opt/render/.cache/ms-playwright/ || echo "Cache dir not found"
    startCommand: |
      echo "=== Starting service ==="
      echo "Cache contents: $(ls /opt/render/.cache/ms-playwright/ 2>/dev/null || echo 'empty')"
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8000
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/.cache/ms-playwright
    healthCheckPath: /api/auth/feishu/status
